<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Dashboard — tests</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Dev-only page: pins the pure functions in index.html. It loads the real app
     in a hidden same-origin iframe and calls its functions directly, so what's
     tested is exactly what ships — no copies, no build step. Serve over
     http://localhost (python3 -m http.server 8013); file:// iframes are blocked
     in some browsers. Nothing here writes localStorage. */
  body { background: var(--bg); color: var(--text-primary); margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid var(--border); background: var(--surface); }
  #summary.ok  { color: var(--ok);  border-color: var(--ok); }
  #summary.bad { color: var(--err); border-color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: var(--ok); }
  tr.fail td.st { color: var(--err); }
  tr.fail td.msg { color: var(--err); }
  .msg { color: var(--text-muted); font-size: 12px; white-space: pre-wrap;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-muted); border-bottom-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Team Dashboard — pure-function tests</h1>
  <p class="sub">
    Runs against the real <code>index.html</code> in a hidden iframe. Read-only: nothing is saved.
    The <code>derive()</code> expectations are pinned to a fixed 141-item sample, so a
    passing run means the metrics still come out exactly as they always have.
  </p>
  <div id="summary">Loading app…</div>
  <table><tbody id="out"></tbody></table>
</div>
<iframe id="app" src="index.html" style="position:absolute;width:1px;height:1px;opacity:0;border:0;left:-9999px" aria-hidden="true"></iframe>

/* The settings the expectations below were computed under. Deliberately fixed
   rather than read from DEFAULT_SETTINGS: a default changing must not quietly
   move every expected number. */
const SAMPLE_SETTINGS = {
  sameDayValue: 0.5,
  unplannedType: 'Bug',
  plannedLabel: 'Stories',
  unplannedLabel: 'Bugs',
  cycleTimeLabel: 'Cycle time'
};

let passed = 0, failed = 0;
const out = document.getElementById('out');

function group(name) {
  const tr = document.createElement('tr');
  tr.className = 'group';
  tr.innerHTML = '<td colspan="3">' + name + '</td>';
  out.appendChild(tr);
}
function record(ok, name, msg) {
  ok ? passed++ : failed++;
  const tr = document.createElement('tr');
  tr.className = ok ? 'pass' : 'fail';
  tr.innerHTML = '<td class="st">' + (ok ? '✓' : '✕') + '</td><td>' + name +
                 '</td><td class="msg">' + (ok ? '' : (msg || '')) + '</td>';
  out.appendChild(tr);
}
function is(actual, expected, name) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  record(a === e, name, 'expected ' + e + '\n     got ' + a);
}
function near(actual, expected, name, eps) {
  const ok = typeof actual === 'number' && Math.abs(actual - expected) < (eps == null ? 1e-9 : eps);
  record(ok, name, 'expected ≈' + expected + '\n     got ' + actual);
}
function ok(cond, name, msg) { record(!!cond, name, msg); }

function run(TD, win) {
  const D = (y, m, d) => TD.utcDate(y, m, d);
  const iso = d => (d ? d.toISOString().slice(0, 10) : null);

  /* ────────────────────────────────────────────────────────── */
  group('date functions');

  is(TD.weekdayNum(D(2015, 2, 8)), 1, 'Sunday = 1');
  is(TD.weekdayNum(D(2015, 2, 13)), 6, 'Friday = 6');
  is(TD.weekdayNum(D(2015, 2, 14)), 7, 'Saturday = 7');

  is(iso(TD.priorSunday(D(2015, 2, 13))), '2015-02-08', 'priorSunday(Fri 13 Feb) = Sun 8 Feb');
  is(iso(TD.priorSunday(D(2015, 2, 8))), '2015-02-08', 'priorSunday of a Sunday is itself');

  is(TD.weekNumber(D(2015, 1, 1)), 1, '1 Jan 2015 is week 1');
  is(TD.weekNumber(D(2015, 1, 3)), 1, '3 Jan 2015 is still week 1');
  is(TD.weekNumber(D(2015, 1, 4)), 2, '4 Jan 2015 is week 2 — a new Sunday');
  is(TD.weekNumber(D(2015, 2, 8)), 7, '8 Feb 2015 is week 7');
  is(TD.weekNumber(D(2015, 5, 10)), 20, '10 May 2015 is week 20');
  is(TD.weekNumber(D(2016, 1, 1)), 1, '1 Jan 2016 is week 1');

  is(TD.weekKey(D(2015, 2, 8)), '2015-07', 'weekKey pads the week number to two digits');
  is(TD.weekKey(D(2015, 1, 1)), '2015-01', 'weekKey(1 Jan) = 2015-01');

  is(iso(TD.edate(D(2015, 5, 13), -3)), '2015-02-13', 'EDATE(13 May 2015, -3) = 13 Feb 2015');
  is(iso(TD.edate(D(2015, 3, 31), -1)), '2015-02-28', 'EDATE clamps 31 Mar back to 28 Feb');
  is(iso(TD.edate(D(2015, 1, 15), -1)), '2014-12-15', 'EDATE crosses the year boundary');

  /* ────────────────────────────────────────────────────────── */
  group('Date parsing');

  is(iso(TD.parseDate('2015-01-21', 'dmy')), '2015-01-21', 'ISO yyyy-mm-dd');
  is(iso(TD.parseDate('2015/01/21', 'dmy')), '2015-01-21', 'ISO with slashes');
  is(iso(TD.parseDate('21/01/2015', 'dmy')), '2015-01-21', 'day-first d/m/yyyy');
  is(iso(TD.parseDate('01/21/2015', 'mdy')), '2015-01-21', 'month-first m/d/yyyy');
  is(iso(TD.parseDate('21/01/2015', 'mdy')), '2015-01-21', 'unambiguous 21 beats the declared order');
  is(iso(TD.parseDate('03/04/2015', 'dmy')), '2015-04-03', 'ambiguous 03/04 as day-first');
  is(iso(TD.parseDate('03/04/2015', 'mdy')), '2015-03-04', 'ambiguous 03/04 as month-first');
  is(iso(TD.parseDate('21 Jan 2015', 'dmy')), '2015-01-21', 'month name, day first');
  is(iso(TD.parseDate('Jan 21 2015', 'dmy')), '2015-01-21', 'month name, month first');
  is(iso(TD.parseDate('21-Jan-15', 'dmy')), '2015-01-21', 'two-digit year expands to 2015');
  is(iso(TD.parseDate('42043', 'dmy')), '2015-02-08', 'a date given as a raw day-count serial');

  /* Jira and Excel hand over timestamps, not bare dates — the clock is dropped. */
  is(iso(TD.parseDate('9/23/2025 10:21', 'mdy')), '2025-09-23', 'm/d/yyyy with a time on the end');
  is(iso(TD.parseDate('23/09/2025 14:05:00', 'dmy')), '2025-09-23', 'd/m/yyyy with seconds');
  is(iso(TD.parseDate('23/Sep/25 4:12 PM', 'dmy')), '2025-09-23', 'Jira dd/Mon/yy with am/pm');
  is(iso(TD.parseDate('2025-09-23T10:21:00Z', 'dmy')), '2025-09-23', 'ISO timestamp with T and Z');
  is(iso(TD.parseDate('9/23/2025 0:00', 'mdy')), '2025-09-23', 'midnight is still a date');
  is(TD.parseDate('10:21', 'dmy'), null, 'a bare time is not a date');

  is(TD.parseDate('', 'dmy'), null, 'blank is not a date');
  is(TD.parseDate('   ', 'dmy'), null, 'whitespace is not a date');
  is(TD.parseDate('Done', 'dmy'), null, 'a word is not a date');
  is(TD.parseDate('31/02/2015', 'dmy'), null, '31 Feb is rejected, not rolled over to 3 Mar');
  is(TD.parseDate('13/13/2015', 'dmy'), null, 'month 13 is rejected');

  is(TD.detectDateOrder([['21/01/2015', '14/01/2015']]), 'dmy', 'detects day-first from a >12 day');
  is(TD.detectDateOrder([['01/21/2015', '01/14/2015']]), 'mdy', 'detects month-first from a >12 second field');
  is(TD.detectDateOrder([['03/04/2015', '01/02/2015']]), 'dmy', 'falls back to day-first when nothing decides');
  /* The whole export being timestamps used to hide every clue and silently
     fall back to day-first, which then failed on every US-format row. */
  is(TD.detectDateOrder([['Task', 'DAE-88', '9/23/2025 10:21', '9/23/2025 0:00']]), 'mdy',
     'detects month-first through a time suffix');
  is(TD.detectDateOrder([['Task', 'DAE-88', '23/09/2025 10:21', '23/09/2025 0:00']]), 'dmy',
     'detects day-first through a time suffix');

  /* ────────────────────────────────────────────────────────── */
  group('Paste parsing');

  const p = TD.parsePastedRows(SAMPLE_PASTE, 'auto');
  is(p.skippedHeader, true, 'header row is detected and skipped');
  is(p.rows.length, 141, 'all 141 sample items parse');
  is(p.badCompleted.length, 0, 'no bad completion dates');
  is(p.badStarted.length, 0, 'no bad start dates');
  is(iso(p.rows[0].completed), '2015-01-21', 'first row completed date');
  is(iso(p.rows[0].started), '2015-01-14', 'first row start date');
  is(p.rows[0].type, '', 'first row has no type');
  is(p.rows[2].type, 'Bug', 'third row is a Bug');

  const pc = TD.parsePastedRows('2015-01-21,2015-01-14,Bug\n2015-01-22,2015-01-15,', 'auto');
  is(pc.rows.length, 2, 'comma-separated rows parse');
  is(pc.skippedHeader, false, 'no header to skip');
  is(pc.rows[0].type, 'Bug', 'type survives comma splitting');

  /* A whole Jira export of US-format timestamps: every row used to be reported
     as a badly formatted completion date and nothing loaded. */
  const pt = TD.parsePastedRows(
    'Work Type\tKey\tResolved\tStart date\n' +
    'Task\tDAE-88\t9/23/2025 10:21\t9/23/2025 0:00\n' +
    'Story\tDAE-87\t10/2/2025 9:34\t9/23/2025 0:00\n' +
    'Story\tDAE-1460\t7/29/2026 16:53\t7/27/2026 0:00', 'auto');
  is(pt.dateOrder, 'mdy', 'the time suffix no longer hides the month-first clue');
  is(pt.rows.length, 3, 'all three timestamped rows load');
  is(pt.badCompleted.length, 0, 'no timestamp is reported as a bad date');
  is(iso(pt.rows[2].completed), '2026-07-29', 'a month-first date past the 12th parses');
  is(pt.rows[0].type, 'Task', 'the type column still comes through');

  const pb = TD.parsePastedRows('Completed\tStarted\tType\nnot-a-date\t2015-01-14\t\n2015-01-21\tnope\t\n2015-01-22\t\t', 'auto');
  is(pb.rows.length, 2, 'a bad completion date drops the row, a bad start date does not');
  is(pb.badCompleted.length, 1, 'one bad completion date counted');
  is(pb.badStarted.length, 1, 'one bad start date counted');
  is(pb.badCompleted[0].line, 2, 'bad-row line numbers account for the header');
  is(pb.rows[0].started, null, 'the row with a bad start date is kept without one');
  is(pb.rows[1].started, null, 'an empty start date is legitimate, not an error');

  /* ────────────────────────────────────────────────────────── */
  group('Cycle time');

  is(TD.cycleTimeOf({ completed: D(2015, 1, 21), started: D(2015, 1, 14) }, 0.5), 7, 'seven days');
  is(TD.cycleTimeOf({ completed: D(2015, 1, 21), started: D(2015, 1, 21) }, 0.5), 0.5, 'same day uses the setting');
  is(TD.cycleTimeOf({ completed: D(2015, 1, 21), started: D(2015, 1, 21) }, 1), 1, 'same-day value is configurable');
  is(TD.cycleTimeOf({ completed: D(2015, 1, 21), started: D(2015, 1, 25) }, 0.5), 0, 'a negative span floors at 0');
  is(TD.cycleTimeOf({ completed: D(2015, 1, 21), started: null }, 0.5), null, 'no start date, no cycle time');

  /* ────────────────────────────────────────────────────────── */
  group('Linear trend');

  is(TD.linearTrend([1, 2, 3, 4]), [1, 2, 3, 4], 'a straight line is recovered exactly');
  const flat = TD.linearTrend([5, 5, 5]);
  ok(flat.every(v => Math.abs(v - 5) < 1e-9), 'a flat series gives a flat trend', JSON.stringify(flat));
  is(TD.linearTrend([]), [], 'no points, no trend');
  is(TD.linearTrend([3]), [null], 'one point cannot make a line');
  const gap = TD.linearTrend([0, null, 2, 3]);
  ok(Math.abs(gap[1] - 1) < 1e-9, 'nulls are skipped but still take up an x slot', JSON.stringify(gap));

  /* ══════════════════════════════════════════════════════════
     derive() against the pinned sample.
     Default view: 3-month window, no work-type filter.
     ══════════════════════════════════════════════════════════ */
  group('derive() — reference sample, 3-month window, no filter');

  const d = TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: '', months: 3 });

  is(d.itemCount, 141, 'every item is in scope — the window trims weeks, not rows');
  is(iso(d.endDate), '2015-05-13', 'end date is the latest date in the data');
  is(iso(d.startDate), '2015-02-13', 'start date is 3 months back from the end date');
  is(d.weeks.length, 14, '14 weeks on the axis');
  is(d.weeks[0], '2015-07', 'first week is 2015-07 (Sunday 8 Feb)');
  is(d.weeks[13], '2015-20', 'last week is 2015-20');

  /* count of items completed in the week */
  is(d.throughput, [7, 7, 16, 9, 11, 10, 6, 7, 12, 6, 8, 8, 8, 9], 'weekly throughput');
  is(d.throughput[0], 7, 'week 1 throughput = 7');
  is(d.throughput[1], 7, 'week 2 throughput = 7');

  /* unplanned rate */
  near(d.unplannedRate[0], 0.2857142857142857, 'week 1 rate = 0.2857… (2 bugs of 7)');
  near(d.unplannedRate[1], 0.14285714285714285, 'week 2 rate = 0.1428… (1 bug of 7)');
  near(d.unplannedRate[11], 0, 'a week with no unplanned work is 0, not blank');

  /* average cycle time */
  near(d.avgCycleTime[0], 10.285714285714286, 'week 1 average cycle time = 10.2857…');
  near(d.avgCycleTime[1], 10, 'week 2 average cycle time = 10');

  /* net flow */
  is(d.netFlow, [-5, 1, 3, -1, 4, -2, 0, -1, 2, 0, 1, -2, 2, 9], 'weekly net flow');
  is(d.netFlow[0], -5, 'week 1 net flow = -5 (7 completed, 12 started)');
  is(d.netFlow[1], 1, 'week 2 net flow = 1');

  /* the chart title carries the average rate */
  is(d.titles.quality, 'Bugs percentage rate (avg: 19.92%)', 'avg bug rate is 19.92%');
  is(d.titles.responsiveness, 'Average Cycle time per week', 'responsiveness title uses the cycle-time wording');
  is(TD.derive(p.rows, Object.assign({}, SAMPLE_SETTINGS, { cycleTimeLabel: 'TiP' }),
     { filterValue: '', months: 3 }).titles.responsiveness, 'Average TiP per week',
     'an acronym label keeps its capitals — "TiP" must not become "tip"');

  /* ────────────────────────────────────────────────────────── */
  group('derive() — window and filter behaviour');

  const dAll = TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: '', months: 'all' });
  is(dAll.startDate, null, '"All" clears the start date');
  is(dAll.weeks[0], '2015-04', 'with no window the axis starts at the first completed week');
  ok(dAll.weeks.length > d.weeks.length, '"All" shows more weeks than a 3-month window',
     dAll.weeks.length + ' vs ' + d.weeks.length);
  is(dAll.itemCount, 141, 'item count is the same either way');

  const d1 = TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: '', months: 1 });
  is(iso(d1.startDate), '2015-04-13', 'a 1-month window starts 1 month back from the end date');
  ok(d1.weeks.length < d.weeks.length, 'a 1-month window shows fewer weeks',
     d1.weeks.length + ' vs ' + d.weeks.length);

  const dBug = TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: 'Bug', months: 'all' });
  is(dBug.itemCount, 29, 'filtering to Bug leaves the 29 bugs');
  ok(dBug.unplannedRate.every(r => r === 0 || r === 1), 'a Bug-only view is all 0% or 100%',
     JSON.stringify(dBug.unplannedRate));

  const dUnplanned = TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: 'Unplanned', months: 'all' });
  is(dUnplanned.itemCount, 12, 'filtering to Unplanned leaves the 12 unplanned items');

  is(TD.derive([], SAMPLE_SETTINGS, { filterValue: '', months: 3 }).empty, true, 'no rows means empty');
  is(TD.derive(p.rows, SAMPLE_SETTINGS, { filterValue: 'Nothing matches this', months: 3 }).empty, true,
     'a filter that matches nothing means empty');

  /* ────────────────────────────────────────────────────────── */
  group('derive() — settings actually change the numbers');

  const dSameDay = TD.derive(
    TD.parsePastedRows('2015-02-09\t2015-02-09\t', 'auto').rows,
    Object.assign({}, SAMPLE_SETTINGS, { sameDayValue: 2 }),
    { filterValue: '', months: 'all' });
  is(dSameDay.avgCycleTime[0], 2, 'the same-day cycle time setting feeds through to the average');

  const dOtherType = TD.derive(p.rows, Object.assign({}, SAMPLE_SETTINGS, { unplannedType: 'Unplanned' }),
    { filterValue: '', months: 3 });
  /* Week 2015-07 happens to hold 2 Bugs and 2 Unplanned, so compare the whole
     series rather than the first point. */
  ok(JSON.stringify(dOtherType.unplannedRate) !== JSON.stringify(d.unplannedRate),
     'renaming the unplanned type changes the quality rate',
     JSON.stringify(dOtherType.unplannedRate) + '\n  vs ' + JSON.stringify(d.unplannedRate));

  const dLabel = TD.derive(p.rows, Object.assign({}, SAMPLE_SETTINGS, { unplannedLabel: 'Incidents' }),
    { filterValue: '', months: 3 });
  ok(dLabel.titles.quality.startsWith('Incidents '), 'the unplanned legend label drives the quality title',
     dLabel.titles.quality);

  /* ══════════════════════════════════════════════════════════
     Column detection. A real Jira export leads with an issue key and orders
     the dates however it likes, so the columns are worked out from the data.
     Getting this wrong silently corrupts every metric.
     ══════════════════════════════════════════════════════════ */
  group('detectColumns — finding the right columns in a real export');

  const cols = s => TD.parsePastedRows(s, 'auto').columns;

  is(cols(['Completed Date\tStart Date\tType',
           '2015-01-21\t2015-01-14\t',
           '2015-01-26\t2015-01-14\tBug',
           '2015-01-26\t2015-01-21\tBug'].join('\n')),
     { completed: 0, started: 1, type: 2 }, 'the plain three-column layout still works');

  is(cols(['Key\tResolved\tIn Progress\tIssue Type',
           'DAE-1\t5/11/2026\t4/27/2026\tStory',
           'DAE-2\t6/22/2026\t4/28/2026\tStory'].join('\n')),
     { completed: 1, started: 2, type: 3 }, 'a leading issue-key column is skipped (header names)');

  is(cols(['DAE-1064\t5/11/2026\t4/27/2026\tStory',
           'DAE-1062\t6/22/2026\t4/28/2026\tStory',
           'DAE-1060\t5/11/2026\t4/27/2026\tBug',
           'DAE-1054\t5/19/2026\t4/29/2026\tStory'].join('\n')),
     { completed: 1, started: 2, type: 3 }, 'a leading issue-key column is skipped with no header at all');

  is(cols(['DAE-1\t4/27/2026\t5/11/2026\tStory',
           'DAE-2\t4/28/2026\t6/22/2026\tStory',
           'DAE-3\t4/27/2026\t5/11/2026\tBug',
           'DAE-4\t4/29/2026\t5/19/2026\tStory'].join('\n')),
     { completed: 2, started: 1, type: 3 },
     'start-before-completed is detected by which date is later, not by position');

  is(cols(['Issue Type\tKey\tResolved\tIn Progress',
           'Story\tDAE-1\t5/11/2026\t4/27/2026',
           'Bug\tDAE-2\t6/22/2026\t4/28/2026'].join('\n')),
     { completed: 2, started: 3, type: 0 }, 'header names win over position');

  is(cols(['AAA-1\t5/11/2026\t4/27/2026\tStory',
           'AAA-2\t6/22/2026\t4/28/2026\tStory',
           'AAA-3\t5/11/2026\t4/27/2026\tStory',
           'AAA-4\t5/19/2026\t4/29/2026\tBug'].join('\n')).type, 3,
     'the type column is told from the key column by repetition, not a ratio');

  is(cols(['AAA-1\tFix the login page\t5/11/2026\t4/27/2026\tStory',
           'AAA-2\tAdd export button\t6/22/2026\t4/28/2026\tStory',
           'AAA-3\tTidy the footer\t5/11/2026\t4/27/2026\tStory',
           'AAA-4\tCache the results\t5/19/2026\t4/29/2026\tBug'].join('\n')),
     { completed: 2, started: 3, type: 4 }, 'a free-text summary column is not mistaken for the type');

  /* ────────────────────────────────────────────────────────── */
  group('Work in progress — started but not finished');

  const wip = TD.parsePastedRows([
    'Key\tResolved\tIn Progress\tType',
    'A-1\t2015-02-12\t2015-02-09\tStory',
    'A-2\t\t2015-02-10\tStory',
    'A-3\t\t2015-02-11\tStory',
    'A-4\t2015-02-20\t2015-02-16\tStory',
    'A-5\t\t\tStory'
  ].join('\n'), 'auto');

  is(wip.rows.length, 4, 'rows with no completion are kept; only a row with neither date is dropped');
  is(wip.unfinished, 2, 'the in-progress ones are counted and reported');
  is(wip.badCompleted.length, 0, 'an empty completion date is NOT an error — it is work in progress');

  /* Needs the header, or the detector quite reasonably reads the one column that
     does hold a date as the completion and there is no bad cell to find. */
  is(TD.parsePastedRows(['Key\tResolved\tIn Progress\tType',
                         'A-1\tnot-a-date\t2015-02-10\tStory'].join('\n'), 'auto').badCompleted.length, 1,
     'text in the completion cell that is not a date is still an error');

  const dWip = TD.derive(wip.rows, SAMPLE_SETTINGS, { filterValue: '', months: 'all' });
  const w07 = dWip.weeks.indexOf('2015-07');
  is(dWip.throughput[w07], 1, 'unfinished items add nothing to throughput');
  /* A-1 alone: 12 Feb − 9 Feb = 3 days. The two unfinished items must not pull it. */
  is(dWip.avgCycleTime[w07], 3, 'unfinished items add nothing to the cycle-time average');
  is(dWip.netFlow[w07], -2,
     'but they DO count as work started: 1 completed − 3 started = −2 (the started tally ignores completion)');
  is(dWip.inProgressCount, 2, 'derive reports how many are still in progress');

  /* The bug this replaced, stated as a test: dropping the unfinished rows makes
     net flow read too positive, because only the completions survive. */
  const finishedOnly = wip.rows.filter(r => r.completed);
  is(TD.derive(finishedOnly, SAMPLE_SETTINGS, { filterValue: '', months: 'all' }).netFlow[w07], 0,
     'sanity: with the unfinished rows thrown away the same week reads 0, not −2');

  is(TD.derive([{ completed: null, started: TD.utcDate(2015, 2, 10), type: '' }],
     SAMPLE_SETTINGS, { filterValue: '', months: 'all' }).empty, true,
     'a team with nothing finished at all has no week axis to draw');

  /* ══════════════════════════════════════════════════════════
     Multi-team state. These are the boundary: everything here decides what a
     copy arriving from the cloud is allowed to turn into.
     ══════════════════════════════════════════════════════════ */
  group('sanitizeTeams — ids from outside are not trusted');

  const S = win.TDState;

  is(S.sanitizeTeams([{ id: 'good-id_1', name: 'A', rows: [] }])[0].id, 'good-id_1',
     'a well-formed id is kept');
  ok(S.sanitizeTeams([{ id: 'has spaces', name: 'A' }])[0].id !== 'has spaces',
     'an id with a space is replaced');
  ok(S.sanitizeTeams([{ id: '"><script>', name: 'A' }])[0].id.match(/^[A-Za-z0-9_-]+$/),
     'an id carrying markup is replaced with a safe one');
  ok(S.sanitizeTeams([{ id: 'x'.repeat(65), name: 'A' }])[0].id.length <= 64,
     'an over-long id is replaced');
  const dupes = S.sanitizeTeams([{ id: 'same', name: 'A' }, { id: 'same', name: 'B' }]);
  ok(dupes[0].id !== dupes[1].id, 'duplicate ids are separated', JSON.stringify(dupes.map(t => t.id)));
  is(S.sanitizeTeams([{ id: 'a' }])[0].name, 'Untitled team', 'a missing name gets a placeholder');
  is(S.sanitizeTeams([{ id: 'a', name: 'X', rows: 'not an array' }])[0].rows, [],
     'rows that are not an array become empty');
  is(S.sanitizeTeams('not an array'), [], 'a teams value that is not an array becomes empty');
  is(S.sanitizeTeams([{ id: 'a', name: 'X', rows: [{ c: '2015-01-21' }, { c: 'rubbish' }, {}] }])[0].rows.length, 1,
     'rows without a usable completed date are dropped on the way in');

  /* ────────────────────────────────────────────────────────── */
  group('normalizeSettings');

  is(S.normalizeSettings({ unplannedType: 'Incident' }).unplannedType, 'Incident', 'a supplied value is kept');
  is(S.normalizeSettings({}).unplannedType, 'Bug', 'a missing value falls back to the default');
  is(S.normalizeSettings({ defectType: 'Incident' }).unplannedType, 'Incident',
     'a value saved under the old defectType key is carried over');
  is(S.normalizeSettings({ defectType: 'Incident' }).defectType, undefined, 'and the old key is dropped');
  is(S.normalizeSettings({ defectType: 'Incident', unplannedType: 'Outage' }).unplannedType, 'Outage',
     'a current value wins over a leftover old one');
  is(S.normalizeSettings({ teamName: 'Kraken' }).teamName, undefined,
     'the v1 teamName field is dropped — teams carry their own names now');
  is(S.normalizeSettings({ filters: [] }).filters.length, 2, 'an empty filter list is restored to the defaults');
  is(S.normalizeSettings(null).filters.length, 2, 'null settings give the defaults');
  is(S.normalizeSettings({ filters: 'nope' }).filters.length, 2, 'a non-array filter list is restored');

  /* ────────────────────────────────────────────────────────── */
  group('hasData — an empty copy must never beat a copy with data');

  is(S.hasData(null), false, 'no state at all is empty');
  is(S.hasData({ teams: [] }), false, 'no teams is empty');
  is(S.hasData({ teams: [{ id: 'a', name: 'My team', rows: [] }] }), false,
     'the one empty team a fresh browser creates does NOT count as data');
  is(S.hasData({ teams: [{ id: 'a', name: 'A', rows: [{}] }] }), true, 'a team with rows counts');
  is(S.hasData({ teams: [{ id: 'a', name: 'A', rows: [] }, { id: 'b', name: 'B', rows: [] }] }), true,
     'two teams count even with no rows — naming them was real work');

  /* ────────────────────────────────────────────────────────── */
  group('isBackup — the guard in front of a restore');

  /* hydrateState turns anything into a valid empty dashboard, so this check is
     the only thing standing between "wrong file chosen" and "every team gone". */
  is(S.isBackup(null), false, 'null is not a backup');
  is(S.isBackup('{}'), false, 'an unparsed string is not a backup');
  is(S.isBackup({}), false, 'an object with no teams array is not a backup');
  is(S.isBackup({ teams: 'Alpha' }), false, 'teams must be an array, not a string');
  is(S.isBackup({ settings: { unplannedType: 'Bug' } }), false,
     'settings alone is not enough — that would restore zero teams over real data');
  is(S.isBackup({ teams: [] }), true, 'an empty teams array is a legitimate backup of nothing');
  is(S.isBackup({ app: 'team-dashboard', version: 2, teams: [{ id: 'a', name: 'A', rows: [] }] }), true,
     'a real export is recognised');

  /* ────────────────────────────────────────────────────────── */
  group('hydrateState round-trip');

  const round = S.hydrateState({
    teams: [{ id: 'team-a', name: 'Alpha', rows: [{ c: '2015-01-21', s: '2015-01-14', t: 'Bug' }] }],
    settings: { unplannedType: 'Incident' }
  });
  is(round.teams.length, 1, 'one team survives');
  is(round.teams[0].name, 'Alpha', 'the name survives');
  is(iso(round.teams[0].rows[0].completed), '2015-01-21', 'an ISO date becomes a Date');
  is(round.teams[0].rows[0].type, 'Bug', 'the type survives');
  is(round.settings.unplannedType, 'Incident', 'settings survive');

  /* Two teams must not be able to see each other's numbers. */
  const teamA = TD.parsePastedRows('2015-01-21\t2015-01-14\t\n2015-01-22\t2015-01-15\t', 'auto').rows;
  const teamB = TD.parsePastedRows('2015-01-21\t2015-01-14\tBug', 'auto').rows;
  const dA = TD.derive(teamA, SAMPLE_SETTINGS, { filterValue: '', months: 'all' });
  const dB = TD.derive(teamB, SAMPLE_SETTINGS, { filterValue: '', months: 'all' });
  is(dA.itemCount, 2, 'team A sees only its own two items');
  is(dB.itemCount, 1, 'team B sees only its own one item');
  ok(dA.unplannedRate[0] !== dB.unplannedRate[0], 'and they produce different numbers',
     dA.unplannedRate[0] + ' vs ' + dB.unplannedRate[0]);

  /* ────────────────────────────────────────────────────────── */
  const sum = document.getElementById('summary');
  sum.className = failed ? 'bad' : 'ok';
  sum.textContent = failed
    ? failed + ' of ' + (passed + failed) + ' failed'
    : 'All ' + passed + ' tests passed';
}

document.getElementById('app').addEventListener('load', function () {
  const w = this.contentWindow;
  if (!w.TD || !w.TDState) {
    document.getElementById('summary').className = 'bad';
    document.getElementById('summary').textContent =
      'Could not reach the app. Serve this over http://localhost — file:// iframes are blocked.';
    return;
  }
  try { run(w.TD, w); }
  catch (e) {
    record(false, 'test run threw', e && e.stack ? e.stack : String(e));
    const sum = document.getElementById('summary');
    sum.className = 'bad';
    sum.textContent = failed + ' of ' + (passed + failed) + ' failed';
  }
});
</script>
</body>
</html>
